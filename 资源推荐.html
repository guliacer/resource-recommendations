  * { box-sizing: border-box; }

  body {

    color: var(--color-foreground);

  .grid { display: grid; }
  .gap-5 { gap: 1.25rem; }
  .gap-3 { gap: 0.75rem; }
  .gap-2 { gap: 0.5rem; }

  header.page-header { display: grid; gap: 0.5rem; }
  header.page-header .label {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.025em; color: var(--color-muted);
  }
  .page-title-row {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem;
  }
  .page-title { min-width: 0; }
  .page-title h1 { font-size: 1.5rem; font-weight: 600; color: var(--color-foreground); margin: 0; }
  .page-title p {
    margin: 0.5rem 0 0; max-width: 48rem; font-size: 0.875rem; line-height: 1.5rem; color: var(--color-muted);
  }
  .count-badge {
    border-radius: 9999px; border: 1px solid var(--color-border); background: var(--color-panel);
    padding: 0.25rem 0.75rem; font-size: 0.75rem; font-weight: 500; color: var(--color-muted);
  }

  section.recommendation-section { display: grid; gap: 0.75rem; }
  .section-header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.5rem;
    border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); padding-bottom: 0.5rem;
  }
  .section-header .title { min-width: 0; }
  .section-header h2 { font-size: 1.125rem; font-weight: 600; color: var(--color-foreground); margin: 0; }
  .section-header p {
    margin: 0.25rem 0 0; max-width: 48rem; font-size: 0.75rem; line-height: 1.25rem; color: var(--color-muted);
  }

  .cards-grid {
    display: grid; gap: 0.75rem;
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }
  @media (min-width: 760px) { .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1180px) { .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .card {
    display: grid; overflow: hidden; border-radius: 0.75rem; border: 1px solid var(--color-border);
    background: var(--color-panel); box-shadow: 0 1px 2px rgb(15 23 42 / 5%);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-image); }

  .card-header {
    display: flex; min-height: 2.5rem; align-items: center; gap: 0.5rem;
    border-bottom: 1px solid var(--color-border); padding: 0.5rem 1rem;
  }
  .card-header .title-wrap { min-width: 0; flex: 1; }
  .card-header h3 {
    margin: 0; font-size: 1rem; font-weight: 600; color: var(--color-foreground);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .card-body { display: grid; gap: 0.5rem; padding: 1rem; }
  .card-desc {
    margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 0.875rem; line-height: 1.25rem; color: var(--color-muted);
  }
  .tags { display: flex; flex-wrap: wrap; gap: 0.375rem; }
  .tag {
    border-radius: 9999px; border: 1px solid var(--color-border); padding: 0.125rem 0.5rem;
    font-size: 11px; line-height: 1.25rem;
  }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding-top: 0.25rem; }
  .btn {
    display: inline-flex; min-height: 2.5rem; align-items: center; justify-content: center; gap: 0.5rem;
    border-radius: 0.75rem; border: 1px solid var(--color-border); background: var(--color-panel);
    color: var(--color-foreground); padding: 0.5rem 0.75rem; font-size: 0.875rem; font-weight: 500;
    line-height: 1; cursor: pointer; text-decoration: none; box-shadow: 0 1px 2px rgb(15 23 42 / 5%);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-elevated); }
  .icon-btn {
    display: inline-flex; width: 2.25rem; height: 2.25rem; align-items: center; justify-content: center;
    border-radius: 0.5rem; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-panel) 85%, transparent);

  }
  .icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-elevated); }
  .icon-btn svg { width: 15px; height: 15px; }

    function rankPinned(url) {
      if (url === PINNED_PROMPT_SITE_URL) return 0;
      if (url === SECOND_PINNED_PROMPT_SITE_URL) return 1;
      return 2;
    }

    function orderRecommendations(items) {
      return items
        .map((site, index) => ({ site, index }))
        .sort((a, b) => {
          const aP = rankPinned(a.site.url);
          const bP = rankPinned(b.site.url);
          if (aP !== bP) return aP - bP;
          return a.index - b.index;
        })
        .map((e) => e.site);
    }

    const ExternalLinkIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
    const GlobeIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>';
    const StarIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;",
      })[c]);
    }

    function renderCard(site, toneName) {
      const tagsHtml = site.tags
        .map((t) => `<span class="tag">${escapeHtml(t)}</span>`)
        .join("");
      return `
        <article class="card tone-${toneName}">
          <div class="card-header">
            <div class="title-wrap">
              <h3>${escapeHtml(site.title)}</h3>
            </div>
            <a class="icon-btn" href="${escapeHtml(site.url)}" target="_blank" rel="noopener noreferrer" title="复制网址" aria-label="复制网址：${escapeHtml(site.title)}">
              ${StarIcon}
            </a>
          </div>
          <div class="card-body">
            <p class="card-desc">${escapeHtml(site.description)}</p>
            <div class="tags">${tagsHtml}</div>
            <div class="actions">
              <a class="btn" href="${escapeHtml(site.url)}" target="_blank" rel="noopener noreferrer">
                ${ExternalLinkIcon}<span>查看</span>
              </a>
              <a class="icon-btn" href="${escapeHtml(site.url)}" target="_blank" rel="noopener noreferrer" title="复制网址" aria-label="复制网址：${escapeHtml(site.title)}">
                ${GlobeIcon}
              </a>
            </div>
          </div>
        </article>`;
    }

    function renderSection(section) {
      const ordered = orderRecommendations(section.items);
      const cardsHtml = ordered
        .map((site) => {
          const originalIndex = section.items.indexOf(site);
          const toneName = TONES[originalIndex % TONES.length];
          return renderCard(site, toneName);
        })
        .join("");
      return `
        <section class="recommendation-section">
          <div class="section-header">
            <div class="title">
              <h2>${escapeHtml(section.title)}</h2>
              <p>${escapeHtml(section.description)}</p>
            </div>
            <span class="count-badge">${section.items.length} 个</span>
          </div>
          <div class="cards-grid">${cardsHtml}</div>
        </section>`;
    }

    function render() {
      const root = document.getElementById("root");
      const total = sections.reduce((sum, s) => sum + s.items.length, 0);
      const sectionsHtml = sections.map(renderSection).join("");
      root.innerHTML = `
